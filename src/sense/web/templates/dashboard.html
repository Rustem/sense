<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sense - Activity Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Flatpickr date picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Activity dates from server -->
    <script>
        // Make activity dates available to JavaScript
        window.ACTIVITY_DATES = {{ activity_dates | tojson }};
    </script>

    <!-- Our JS modules -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/insights.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .metric-value {
            font-family: "SF Mono", Monaco, monospace;
        }
        /* Timeline color coding */
        .vis-item.deep-focus {
            background-color: #10b981 !important;
            border-color: #059669 !important;
        }
        .vis-item.interruption {
            background-color: #ef4444 !important;
            border-color: #dc2626 !important;
        }
        /* Flatpickr - highlight dates with activity */
        .flatpickr-day.has-activity {
            background-color: #dbeafe !important;
            border-color: #3b82f6 !important;
            font-weight: 600;
        }
        .flatpickr-day.has-activity:hover {
            background-color: #bfdbfe !important;
        }
        .flatpickr-day.has-activity.selected {
            background-color: #3b82f6 !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-semibold text-gray-900">Sense</h1>
            <div class="flex items-center gap-4">
                <input type="text"
                       id="date-picker"
                       placeholder="Select date..."
                       class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <!-- Key Metrics -->
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <div class="text-sm text-gray-500 mb-1">Active Time</div>
                <div id="active-time" class="metric-value text-3xl font-bold text-gray-900">-</div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <div class="text-sm text-gray-500 mb-1">Focus Sessions</div>
                <div id="focus-sessions" class="metric-value text-3xl font-bold text-blue-600">-</div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <div class="text-sm text-gray-500 mb-1">Context Switches</div>
                <div id="context-switches" class="metric-value text-3xl font-bold text-orange-600">-</div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <div class="text-sm text-gray-500 mb-1">Interruptions</div>
                <div id="interruptions" class="metric-value text-3xl font-bold text-red-600">-</div>
            </div>
        </div>

        <!-- Insights -->
        <div class="bg-white rounded-lg border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">💡 Insights</h2>
            <ul id="insights-list" class="space-y-2 text-gray-700">
                <li>Loading insights...</li>
            </ul>
        </div>

        <!-- AI Recommendations -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg border border-blue-200 p-6 mb-8 opacity-75">
            <div class="flex items-center gap-3 mb-4">
                <h2 class="text-lg font-semibold text-gray-900">🤖 AI Recommendations</h2>
                <span class="px-2 py-1 bg-blue-500 text-white text-xs font-semibold rounded-full">COMING SOON</span>
            </div>
            <div id="recommendations" class="space-y-3 text-gray-700">
                <p class="italic text-gray-500">AI-powered productivity recommendations will appear here</p>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-2 gap-6 mb-8">
            <!-- Focus Sessions -->
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Top 5 Focus Apps</h2>
                <div class="h-64">
                    <canvas id="focus-chart"></canvas>
                </div>
            </div>

            <!-- Interruption Patterns -->
            <div class="bg-white rounded-lg border border-gray-200 p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Top 5 Interruption Patterns</h2>
                <div class="h-64">
                    <canvas id="interrupters-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Top Switch Patterns -->
        <div class="bg-white rounded-lg border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Top 5 Switch Patterns</h2>
            <div class="h-64">
                <canvas id="switch-patterns-chart"></canvas>
            </div>
        </div>

        <!-- Context Switches Trend -->
        <div class="bg-white rounded-lg border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Context Switches (Hourly)</h2>
            <div class="h-64">
                <canvas id="switches-chart"></canvas>
            </div>
        </div>

        <!-- Timeline Viewer with Tabs -->
        <div class="bg-white rounded-lg border border-gray-200 p-6" x-data="{ activeTab: 'timeline', includeWebSwitches: false }">
            <div class="flex gap-4 border-b border-gray-200 mb-6">
                <button @click="activeTab = 'timeline'"
                        :class="activeTab === 'timeline' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="px-4 py-2 border-b-2 font-medium text-sm transition-colors">
                    Timeline
                </button>
                <button @click="activeTab = 'switches'"
                        :class="activeTab === 'switches' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="px-4 py-2 border-b-2 font-medium text-sm transition-colors">
                    Switches
                </button>
                <button @click="activeTab = 'interruptions'"
                        :class="activeTab === 'interruptions' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="px-4 py-2 border-b-2 font-medium text-sm transition-colors">
                    Interruptions
                </button>

                <!-- Checkbox for web switches (only visible on switches tab) -->
                <div x-show="activeTab === 'switches'" class="ml-auto flex items-center">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" x-model="includeWebSwitches" class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="text-sm text-gray-700">Include web switches</span>
                    </label>
                </div>
            </div>

            <div x-show="activeTab === 'timeline'" class="h-96">
                <div id="timelineVis"></div>
            </div>
            <div x-show="activeTab === 'switches'" class="h-96">
                <div id="switchesVis"></div>
            </div>
            <div x-show="activeTab === 'interruptions'" class="h-96">
                <div id="interruptionsVis"></div>
            </div>
        </div>
    </main>

</body>
</html>
